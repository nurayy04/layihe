<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberLearn – Təhlükəsizlik, şəbəkə və data kursları</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070d;--panel:#0a111f;--card:#0d1626;--line:#18284a;--pri:#1e6bff;--cy:#3fb6ff;--ink:#e8f0ff;--mut:#8da2c4;--ok:#2fd6a1}
*{box-sizing:border-box;margin:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.hidden{display:none!important}

@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,107,255,.6)}50%{box-shadow:0 0 0 22px rgba(30,107,255,0)}}
@keyframes load{from{width:0}to{width:100%}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{text-shadow:0 0 12px rgba(63,182,255,.4)}50%{text-shadow:0 0 28px rgba(63,182,255,.95)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{to{opacity:0;visibility:hidden}}

.btn{border:0;border-radius:12px;padding:.8rem 1.3rem;font-weight:700;color:#fff;background:linear-gradient(90deg,#1450d6,var(--pri),var(--cy));background-size:200% 100%;transition:transform .2s,box-shadow .2s,background-position .5s}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 28px rgba(30,107,255,.5);background-position:100% 0}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.full{width:100%}
.btn:disabled{background:var(--line);color:var(--mut);cursor:default}

/* ---------- Giriş ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#0b2a66 0,transparent 45%),radial-gradient(circle at 90% 90%,#06214f 0,transparent 40%),var(--bg)}
#net{position:absolute;inset:0}
.glass{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 1fr;max-width:960px;width:100%;background:rgba(10,17,31,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 0 80px rgba(30,107,255,.25);animation:rise .8s both}
.intro{padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;border-right:1px solid var(--line)}
.logo{font-weight:800;font-size:1.2rem;color:var(--cy);animation:glow 3s infinite}
.intro h1{font-size:clamp(1.9rem,4vw,3rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.intro p{color:var(--mut);max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips span{border:1px solid var(--line);border-radius:99px;padding:.3rem .8rem;font-size:.82rem;color:var(--cy)}
.stats{display:flex;gap:1.6rem}
.stats b{display:block;font-size:1.9rem;color:var(--cy)}
.stats div{color:var(--mut);font-size:.85rem}
.formside{padding:2.5rem}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:1.3rem}
.tabs i{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:var(--pri);border-radius:11px;transition:transform .35s cubic-bezier(.5,1.6,.5,1)}
.tabs.log i{transform:translateX(100%)}
.tabs button{position:relative;background:none;border:0;padding:.7rem;font-weight:600;color:var(--mut);transition:color .3s}
.tabs button.on{color:#fff}
label{display:block;font-weight:600;font-size:.85rem;margin:1rem 0 .3rem;color:var(--mut)}
input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(30,107,255,.25)}
#nameWrap{overflow:hidden;transition:max-height .4s,opacity .4s;max-height:120px}
#nameWrap.off{max-height:0;opacity:0}
.msg{min-height:1.4rem;margin:.8rem 0;font-size:.88rem;font-weight:600;color:#ff6b81}
.msg.ok{color:var(--ok)}
.shake{animation:shake .35s}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;text-align:center}
.splash.go{animation:fade .5s 1.5s forwards}
.shield{width:90px;height:90px;border-radius:26px;display:grid;place-items:center;font-size:2.6rem;margin:0 auto 1.4rem;background:linear-gradient(135deg,#1450d6,var(--cy));animation:pulse 1.3s infinite}
.ld{width:220px;height:5px;background:var(--line);border-radius:9px;margin:1rem auto 0;overflow:hidden}
.ld i{display:block;height:100%;background:var(--cy);animation:load 1.5s ease forwards}

/* ---------- Panel ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:1.6rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:0;height:100vh;animation:slide .6s both}
aside h2{font-size:1.25rem;font-weight:800;color:var(--cy);margin:0 0 1.4rem .6rem}
aside button{background:none;border:0;color:var(--mut);text-align:left;padding:.8rem 1rem;border-radius:12px;font-weight:600;transition:background .25s,transform .25s,color .25s}
aside button:hover{background:rgba(30,107,255,.12);color:var(--ink);transform:translateX(6px)}
aside button.on{background:linear-gradient(90deg,var(--pri),#1450d6);color:#fff;box-shadow:0 6px 22px rgba(30,107,255,.4)}
aside .out{margin-top:auto;border:1.5px solid var(--line)}
.lvl{margin:1rem .4rem;font-size:.82rem;color:var(--mut)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.lvl .bar{margin-top:.4rem}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--cy));transition:width 1s cubic-bezier(.3,1,.4,1)}
main{padding:2.5rem;max-width:1100px;width:100%}
main>*{animation:slide .55s both}
main h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:.2rem 0 1.6rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.6rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.3rem;animation:rise .6s both;animation-delay:calc(var(--i,0)*100ms)}
.kpi b{display:block;font-size:2rem;font-weight:800;color:var(--cy)}
.kpi span{color:var(--mut);font-size:.85rem}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:.45rem 1.1rem;font-weight:600;transition:.25s}
.filters button:hover{color:var(--ink);border-color:var(--pri)}
.filters button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;animation:rise .6s both;animation-delay:calc(var(--i,0)*80ms);transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-8px);border-color:var(--pri);box-shadow:0 16px 44px rgba(30,107,255,.35)}
.cov{height:105px;display:grid;place-items:center;font-size:3.2rem;background:var(--g);position:relative;overflow:hidden}
.cov span{transition:transform .4s}
.card:hover .cov span{transform:scale(1.3) rotate(-8deg)}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:200% 100%;opacity:0}
.card:hover .cov::after{opacity:1;animation:shine 1.1s}
.cb{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.cb h3{font-size:1.05rem}.cb p{color:var(--mut);font-size:.87rem}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;background:rgba(63,182,255,.14);color:var(--cy);padding:.2rem .7rem;border-radius:99px}
.cb .btn{margin-top:auto}
.badge{text-align:center;padding:1.8rem 1rem;align-items:center;gap:.3rem}
.badge .ic{font-size:3rem}
.badge.lock{opacity:.4;filter:grayscale(1)}
.badge.win{border-color:var(--cy);box-shadow:0 0 28px rgba(63,182,255,.25)}
.badge.win .ic{animation:pop .7s both;animation-delay:calc(var(--i,0)*90ms + .2s)}
.badge p{color:var(--mut);font-size:.85rem}
.pad{padding:1.3rem 1.6rem}
.row{display:flex;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;margin-bottom:1rem;background:linear-gradient(135deg,#1450d6,var(--cy));animation:pop .6s both}

/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(2,5,12,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:1rem;animation:rise .3s both}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:rise .4s both}
.mhead{padding:1.8rem;background:var(--g);display:flex;gap:1rem;align-items:center;position:relative}
.mhead .big{font-size:3rem}
.mhead h2{font-size:1.3rem}
.x{position:absolute;top:.8rem;right:.8rem;background:rgba(0,0,0,.35);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.1rem}
.mbody{padding:1.5rem 1.8rem 1.8rem}
.meta{display:flex;gap:1.2rem;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin:.8rem 0 1.2rem}
.mods{list-style:none;padding:0;display:grid;gap:.5rem;margin-bottom:1.4rem}
.mods li{display:flex;gap:.8rem;align-items:center;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;animation:slide .45s both;animation-delay:calc(var(--i)*70ms)}
.mods li i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:700;background:var(--bg);color:var(--mut);flex:none}
.mods li.done{border-color:var(--ok)}
.mods li.done i{background:var(--ok);color:#04110c}
.mods li.next{border-color:var(--pri);background:rgba(30,107,255,.1)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--panel);border:1px solid var(--cy);border-left:6px solid var(--cy);padding:1rem 1.4rem;border-radius:14px;font-weight:600;animation:slide .4s both;z-index:70}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

@media (max-width:820px){
 .glass{grid-template-columns:1fr}.intro{padding:2rem;border:0}.formside{padding:1.8rem}
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border:0}
 aside h2{width:100%;margin-bottom:.4rem}aside .out{margin:0}.lvl{display:none}
 main{padding:1.4rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- QEYDİYYAT / GİRİŞ -->
<section class="auth" id="auth">
  <canvas id="net"></canvas>
  <div class="glass">
    <div class="intro">
      <div class="logo">🛡️ CyberLearn</div>
      <h1>Təhlükəsizliyi, şəbəkəni və datanı öyrən.</h1>
      <p>Qeydiyyatdan keç, daxil ol və kurs proqramlarına bax.</p>
      <div class="chips"><span>Kibertəhlükəsizlik</span><span>Şəbəkə</span><span>Data analitika</span><span>Kriptoqrafiya</span></div>
      <div class="stats">
        <div><b data-count="8">0</b>kurs</div>
        <div><b data-count="40">0</b>modul</div>
        <div><b data-count="8">0</b>nailiyyət</div>
      </div>
    </div>
    <div class="formside">
      <div class="tabs" id="tabs"><i></i>
        <button class="on" id="tReg" type="button">Qeydiyyat</button>
        <button id="tLog" type="button">Giriş</button>
      </div>
      <form id="form" novalidate>
        <div id="nameWrap"><label for="name">Ad və soyad</label><input id="name" autocomplete="name"></div>
        <label for="email">E-poçt</label><input id="email" type="email" autocomplete="email">
        <label for="pass">Şifrə (ən azı 6 simvol)</label><input id="pass" type="password" autocomplete="current-password">
        <div class="msg" id="msg" role="alert"></div>
        <button class="btn full" id="submit">Qeydiyyatdan keç</button>
      </form>
    </div>
  </div>
</section>

<!-- Giriş animasiyası -->
<div class="splash hidden" id="splash"><div><div class="shield">🛡️</div><b>Hesabına daxil olunur…</b><div class="ld"><i></i></div></div></div>

<!-- PANEL -->
<div class="app hidden" id="app">
  <aside>
    <h2>🛡️ CyberLearn</h2>
    <button class="on" data-p="courses">📚 Tədris proqramı</button>
    <button data-p="mine">🎯 Kurslarım</button>
    <button data-p="ach">🏆 Nailiyyətlər</button>
    <button data-p="prof">👤 Profil</button>
    <div class="lvl"><span id="lvlTxt"></span><div class="bar"><i id="lvlBar"></i></div></div>
    <button class="out" id="logout">Çıxış</button>
  </aside>
  <main id="view"></main>
</div>
<div class="modal hidden" id="modal"></div>
<div class="toast hidden" id="toast"></div>
<canvas id="fx"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== SUPABASE AYARLARI: Supabase → Project Settings → API ===== */
const SUPABASE_URL='https://ggqofuwqfbmxhvyeiozg.supabase.co';       // məs: https://abcdxyz.supabase.co
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncW9mdXdxZmJteGh2eWVpb3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDU5MzgsImV4cCI6MjEwODA4MTkzOH0.GGQMM8EYnQv31JVdtJEAylGsSkgSdwZ0ktYZ91VIce0';    // yalnız "anon public" açar! service_role açarını bura QOYMA
const sb=(window.supabase&&!SUPABASE_URL.startsWith('BURAYA'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

const COURSES=[
 {id:'sec',ic:'🛡️',cat:'Təhlükəsizlik',t:'Kibertəhlükəsizliyin əsasları',d:'Rəqəmsal təhlükələri tanı və özünü qoru.',lv:'Başlanğıc',h:10,g:'linear-gradient(135deg,#1450d6,#0a1f4d)',
  m:['Təhlükə növləri və hücum nümunələri','Parol və çoxfaktorlu autentifikasiya','Zərərli proqramlar və qorunma','Sosial mühəndislik və fişinq','Təhlükəsiz gündəlik davranış']},
 {id:'net',ic:'🌐',cat:'Şəbəkə',t:'Kompüter şəbəkələri',d:'Məlumat şəbəkədə necə hərəkət edir.',lv:'Başlanğıc',h:12,g:'linear-gradient(135deg,#00b4ff,#0b3a8f)',
  m:['OSI və TCP/IP modelləri','IP ünvanlama və alt şəbəkələr','Marşrutlaşdırma və kommutasiya','DNS, DHCP və əsas protokollar','Firewall və şəbəkə təhlükəsizliyi']},
 {id:'data',ic:'📊',cat:'Data',t:'Data analitika',d:'Datadan nəticə çıxar və hesabat hazırla.',lv:'Başlanğıc',h:14,g:'linear-gradient(135deg,#3fb6ff,#1450d6)',
  m:['Data nədir və necə toplanır','Excel və SQL ilə sorğular','Datanın təmizlənməsi','Vizuallaşdırma və dashboard','Analitik hesabat yazmaq']},
 {id:'crypto',ic:'🔐',cat:'Təhlükəsizlik',t:'Kriptoqrafiya',d:'Məlumatı şifrələmənin riyaziyyatı və praktikası.',lv:'Orta',h:12,g:'linear-gradient(135deg,#0a1f4d,#3fb6ff)',
  m:['Simmetrik şifrələmə','Asimmetrik şifrələmə','Hash funksiyaları','Rəqəmsal imza','TLS və açıq açar infrastrukturu']},
 {id:'cloud',ic:'☁️',cat:'Təhlükəsizlik',t:'Bulud və Zero Trust təhlükəsizliyi',d:'Bulud mühitini “heç kimə güvənmə” prinsipi ilə qoru.',lv:'Orta',h:12,g:'linear-gradient(135deg,#1e6bff,#050b1a)',
  m:['Bulud xidmət modelləri','İdentiklik və giriş idarəsi (IAM)','Şifrələmə və açar idarəsi','Zero Trust arxitekturası','Monitorinq və insident reaksiyası']},
 {id:'isms',ic:'📋',cat:'Təhlükəsizlik',t:'ISMS və risk idarəetməsi',d:'İnformasiya təhlükəsizliyi idarəetmə sistemi.',lv:'Orta',h:10,g:'linear-gradient(135deg,#143a8c,#050b1a)',
  m:['ISO 27001-ə giriş','Aktivlərin və risklərin qiymətləndirilməsi','Nəzarətlərin seçilməsi','Siyasət və prosedurlar','Audit və davamlı təkmilləşdirmə']},
 {id:'py',ic:'🐍',cat:'Proqramlaşdırma',t:'Python proqramlaşdırma',d:'Təhlükəsizlik və data üçün Python.',lv:'Başlanğıc',h:14,g:'linear-gradient(135deg,#00b4ff,#04070d)',
  m:['Dəyişənlər və verilənlər','Şərtlər və dövrlər','Funksiyalar və modullar','Fayl və data ilə iş','Kiçik avtomatlaşdırma layihəsi']},
 {id:'eth',ic:'🕵️',cat:'Təhlükəsizlik',t:'Etik hakerlik və zəiflik analizi',d:'Sistemləri icazə ilə yoxla və hesabat yaz.',lv:'İrəli',h:16,g:'linear-gradient(135deg,#050b1a,#1e6bff)',
  m:['Etika və hüquqi çərçivə','Məlumat toplama və kəşfiyyat','Zəifliklərin aşkarlanması','Riskin qiymətləndirilməsi','Professional hesabat']}
];
const CATS=['Hamısı','Təhlükəsizlik','Şəbəkə','Data','Proqramlaşdırma'];
const done=(u,c)=>(u.progress[c.id]||0)>=c.m.length;
const ACH=[
 {id:'a1',ic:'🚀',t:'İlk addım',d:'Hesab yarat',ok:u=>true},
 {id:'a2',ic:'📖',t:'Kursa yazıl',d:'1 kursa qeydiyyat',ok:u=>Object.keys(u.progress).length>=1},
 {id:'a3',ic:'✅',t:'İlk modul',d:'1 modulu tamamla',ok:u=>total(u)>=1},
 {id:'a4',ic:'🔥',t:'Davamlı',d:'5 modul tamamla',ok:u=>total(u)>=5},
 {id:'a5',ic:'🎓',t:'Məzun',d:'Bir kursu bitir',ok:u=>COURSES.some(c=>done(u,c))},
 {id:'a6',ic:'🌟',t:'Maraqlı',d:'3 kursa yazıl',ok:u=>Object.keys(u.progress).length>=3},
 {id:'a7',ic:'🌐',t:'Şəbəkəçi',d:'Şəbəkə kursunu bitir',ok:u=>done(u,COURSES[1])},
 {id:'a8',ic:'🛡️',t:'Müdafiəçi',d:'Kibertəhlükəsizlik kursunu bitir',ok:u=>done(u,COURSES[0])}
];
const total=u=>Object.values(u.progress).reduce((a,b)=>a+b,0);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* Hesab məlumatı (ad, e-poçt, hash, salt) Supabase-dədir. Burada yalnız kurs proqresi saxlanır. */
const db={
 prog:e=>{try{return JSON.parse(localStorage.getItem('prog:'+e))||{progress:{},seen:['a1']}}catch(x){return{progress:{},seen:['a1']}}},
 save:u=>localStorage.setItem('prog:'+u.email,JSON.stringify({progress:u.progress,seen:u.seen,joined:u.joined})),
 cur:()=>{const e=localStorage.getItem('session');if(!e)return null;return {...db.prog(e),name:localStorage.getItem('sname')||e,email:e}}
};
let mode='reg',panel='courses',cat='Hamısı',openId=null;

/* Saymaq animasiyası */
function countUp(root){
 (root||document).querySelectorAll('[data-count]').forEach(el=>{
  const to=+el.dataset.count,t0=performance.now();
  (function f(t){const p=Math.min((t-t0)/1200,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
 });
}
countUp();

/* Şəbəkə fonu (canvas) */
const ac=$('#net'),ax=ac.getContext('2d');let N=[];
function netInit(){
 ac.width=innerWidth;ac.height=innerHeight;
 N=Array.from({length:Math.min(80,innerWidth/16|0)},()=>({x:Math.random()*ac.width,y:Math.random()*ac.height,vx:reduce?0:(Math.random()-.5)*.6,vy:reduce?0:(Math.random()-.5)*.6}));
}
function netLoop(){
 if(!$('#auth').classList.contains('hidden')){
  ax.clearRect(0,0,ac.width,ac.height);
  N.forEach((p,i)=>{
   p.x+=p.vx;p.y+=p.vy;
   if(p.x<0||p.x>ac.width)p.vx*=-1;if(p.y<0||p.y>ac.height)p.vy*=-1;
   ax.fillStyle='rgba(63,182,255,.9)';ax.beginPath();ax.arc(p.x,p.y,2,0,6.3);ax.fill();
   for(let j=i+1;j<N.length;j++){
    const q=N[j],d=Math.hypot(p.x-q.x,p.y-q.y);
    if(d<140){ax.strokeStyle=`rgba(30,107,255,${.5*(1-d/140)})`;ax.beginPath();ax.moveTo(p.x,p.y);ax.lineTo(q.x,q.y);ax.stroke()}
   }
  });
 }
 requestAnimationFrame(netLoop);
}
netInit();netLoop();addEventListener('resize',netInit);

/* Konfetti */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf;
function confetti(){
 if(reduce)return;
 cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#1e6bff','#3fb6ff','#ffffff','#0a3fbf','#7fd0ff'];
 for(let i=0;i<140;i++)parts.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:cols[i%5],r:Math.random()*6});
 cancelAnimationFrame(raf);
 (function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+20);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  if(parts.length)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
 })();
}

/* ---------- Şifrə heşləmə: PBKDF2-SHA256 + hər istifadəçi üçün təsadüfi salt ---------- */
const ITER=210000;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pass,salt,iter){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
 return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},km,256));
}
function same(a,b){ /* sabit vaxtlı müqayisə */
 if(a.length!==b.length)return false;
 let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);
 return r===0;
}
async function makeCred(pass){
 const salt=crypto.getRandomValues(new Uint8Array(16));
 return {salt:b64(salt),iter:ITER,hash:await hashPw(pass,salt,ITER)};
}

/* Qeydiyyat / giriş */
function setMode(m){
 mode=m;
 $('#tabs').classList.toggle('log',m==='log');
 $('#tReg').classList.toggle('on',m==='reg');$('#tLog').classList.toggle('on',m==='log');
 $('#nameWrap').classList.toggle('off',m==='log');
 $('#submit').textContent=m==='reg'?'Qeydiyyatdan keç':'Daxil ol';
 setMsg('');
}
function setMsg(t,ok){const m=$('#msg');m.textContent=t;m.classList.toggle('ok',!!ok);m.classList.remove('shake');if(t&&!ok){void m.offsetWidth;m.classList.add('shake')}}
$('#tReg').onclick=()=>setMode('reg');
$('#tLog').onclick=()=>setMode('log');

$('#form').onsubmit=async e=>{
 e.preventDefault();
 if(!(window.crypto&&crypto.subtle))return setMsg('Bu brauzerdə şifrələmə funksiyası əlçatan deyil (HTTPS və ya localhost lazımdır).');
 if(!sb)return setMsg('Supabase ayarları doldurulmayıb (SUPABASE_URL və SUPABASE_KEY).');
 const name=$('#name').value.trim(),email=$('#email').value.trim().toLowerCase(),pass=$('#pass').value;
 if(mode==='reg'&&name.length<2)return setMsg('Adını yaz.');
 if(!/^\S+@\S+\.\S+$/.test(email))return setMsg('Düzgün e-poçt ünvanı yaz.');
 if(pass.length<6)return setMsg('Şifrə ən azı 6 simvol olmalıdır.');
 const btn=$('#submit');btn.disabled=true;
 try{
  if(mode==='reg'){
   /* Brauzer yalnız hash, salt və iter göndərir; açıq şifrə heç yerə getmir */
   const c=await makeCred(pass);
   const {data,error}=await sb.rpc('register_user',{p_name:name,p_email:email,p_hash:c.hash,p_salt:c.salt,p_iter:c.iter});
   if(error){console.error(error);return setMsg('Server xətası: '+error.message)}
   if(data==='EMAIL_EXISTS')return setMsg('Bu e-poçt artıq qeydiyyatdan keçib. Giriş et.');
   db.save({email,progress:{},seen:['a1'],joined:new Date().toLocaleDateString('az')});
   $('#form').reset();setMode('log');
   $('#email').value=email;$('#pass').focus();
   setMsg('✅ Qeydiyyat uğurludur! İndi şifrənlə daxil ol.',true);
   return;
  }
  /* Giriş: 1) salt və iter al  2) hash-i brauzerdə hesabla  3) serverdə yoxla */
  const {data:meta,error:e1}=await sb.rpc('get_salt',{p_email:email});
  if(e1||!meta){console.error(e1);return setMsg('Serverə qoşulmaq olmadı.')}
  const h=await hashPw(pass,unb64(meta.salt),meta.iter);
  const {data:res,error:e2}=await sb.rpc('verify_login',{p_email:email,p_hash:h});
  if(e2){console.error(e2);return setMsg('Server xətası: '+e2.message)}
  if(res&&res.blocked)return setMsg('Çox sayda uğursuz cəhd. 10 dəqiqə sonra yenidən cəhd et.');
  if(!res)return setMsg('E-poçt və ya şifrə səhvdir.');
  localStorage.setItem('session',email);localStorage.setItem('sname',res.name);
  $('#form').reset();
  enter(true);
 }catch(err){console.error(err);setMsg('Gözlənilməz xəta. Brauzer konsoluna bax.')}
 finally{btn.disabled=false}
};

function enter(animated){
 $('#auth').classList.add('hidden');
 const go=()=>{$('#app').classList.remove('hidden');show('courses')};
 if(!animated||reduce){go();return}
 const s=$('#splash');s.classList.remove('hidden','go');void s.offsetWidth;s.classList.add('go');
 setTimeout(()=>{go();s.classList.add('hidden');confetti();toast('👋 Xoş gəldin, '+db.cur().name.split(' ')[0]+'!')},1900);
}
$('#logout').onclick=()=>{
 localStorage.removeItem('session');localStorage.removeItem('sname');closeModal();
 $('#app').classList.add('hidden');$('#auth').classList.remove('hidden');setMode('log');
};

/* Pəncərələr */
document.querySelectorAll('aside [data-p]').forEach(b=>b.onclick=()=>show(b.dataset.p));
function courseCard(c,u,i,mine){
 const d=u.progress[c.id],on=c.id in u.progress,n=c.m.length;
 return `<div class="card" style="--i:${i}"><div class="cov" style="--g:${c.g}"><span>${c.ic}</span></div>
 <div class="cb"><span class="tag">${c.cat}</span><h3>${c.t}</h3><p>${c.d}</p><p>⏱ ${c.h} saat · ${n} modul · ${c.lv}</p>
 ${on?`<div class="bar"><i data-w="${d/n*100}"></i></div><p>${d} / ${n} modul tamamlandı</p>`:''}
 <button class="btn" data-open="${c.id}">${mine&&on&&d<n?'Davam et':'Proqrama bax'}</button></div></div>`;
}
function show(p){
 panel=p;
 document.querySelectorAll('aside [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 const u=db.cur();if(!u)return;
 const v=$('#view');let h='';
 if(p==='courses'){
  const fin=COURSES.filter(c=>done(u,c)).length;
  h=`<h1>Salam, ${esc(u.name.split(' ')[0])} 👋</h1><p class="sub">Tədris proqramını seç və öyrənməyə başla.</p>
  <div class="kpis">
   <div class="kpi" style="--i:0"><b data-count="${total(u)}">0</b><span>tamamlanan modul</span></div>
   <div class="kpi" style="--i:1"><b data-count="${Object.keys(u.progress).length}">0</b><span>aktiv kurs</span></div>
   <div class="kpi" style="--i:2"><b data-count="${fin}">0</b><span>bitmiş kurs</span></div>
  </div>
  <div class="filters">${CATS.map(c=>`<button class="${c===cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  <div class="grid">`+COURSES.filter(c=>cat==='Hamısı'||c.cat===cat).map((c,i)=>courseCard(c,u,i,false)).join('')+`</div>`;
 }
 if(p==='mine'){
  const mine=COURSES.filter(c=>c.id in u.progress);
  h=`<h1>Kurslarım</h1><p class="sub">Modulları ardıcıl tamamla.</p>`+(mine.length?`<div class="grid">`+mine.map((c,i)=>courseCard(c,u,i,true)).join('')+`</div>`
   :`<div class="card pad"><p>Hələ heç bir kursa yazılmamısan. “Tədris proqramı” bölməsindən kurs seç.</p></div>`);
 }
 if(p==='ach'){
  const got=ACH.filter(a=>a.ok(u)).length;
  h=`<h1>Nailiyyətlər</h1><p class="sub">${got} / ${ACH.length} qazanılıb</p><div class="grid">`+
  ACH.map((a,i)=>{const w=a.ok(u);return `<div class="card badge ${w?'win':'lock'}" style="--i:${i}"><div class="ic">${w?a.ic:'🔒'}</div><h3>${a.t}</h3><p>${a.d}</p></div>`}).join('')+`</div>`;
 }
 if(p==='prof'){
  h=`<h1>Profil</h1><p class="sub">Hesab məlumatların.</p><div class="card pad"><div class="avatar">${esc(u.name[0].toUpperCase())}</div>
  <div class="row"><span>Ad</span><b>${esc(u.name)}</b></div>
  <div class="row"><span>E-poçt</span><b>${esc(u.email)}</b></div>
  <div class="row"><span>Qoşulma tarixi</span><b>${u.joined||'—'}</b></div>
  <div class="row"><span>Tamamlanan modul</span><b>${total(u)}</b></div></div>`;
 }
 v.innerHTML=h;countUp(v);fillBars(v);
 $('#lvlTxt').textContent=`Səviyyə ${Math.floor(total(u)/5)+1} · ${total(u)} modul`;
 $('#lvlBar').style.width=Math.min(total(u)/40*100,100)+'%';
}
function fillBars(r){requestAnimationFrame(()=>setTimeout(()=>r.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),60))}

/* Kurs təfərrüatı (modal) */
function openModal(id){
 openId=id;const u=db.cur(),c=COURSES.find(x=>x.id===id),d=u.progress[id],on=id in u.progress,n=c.m.length;
 $('#modal').innerHTML=`<div class="mbox"><div class="mhead" style="--g:${c.g}"><span class="big">${c.ic}</span><div><span class="tag">${c.cat}</span><h2>${c.t}</h2></div><button class="x" data-close aria-label="Bağla">✕</button></div>
 <div class="mbody"><p>${c.d}</p><div class="meta"><span>⏱ ${c.h} saat</span><span>📚 ${n} modul</span><span>🎯 ${c.lv}</span></div>
 <ul class="mods">${c.m.map((t,i)=>`<li class="${on&&i<d?'done':on&&i===d?'next':''}" style="--i:${i}"><i>${on&&i<d?'✓':i+1}</i><span>${t}</span></li>`).join('')}</ul>
 ${on?`<div class="bar" style="margin-bottom:1rem"><i data-w="${d/n*100}"></i></div>
 <button class="btn full" data-lesson="${id}" ${d>=n?'disabled':''}>${d>=n?'Kurs bitdi 🎉':'Növbəti modulu tamamla'}</button>`
 :`<button class="btn full" data-enroll="${id}">Kursa yazıl</button>`}</div></div>`;
 $('#modal').classList.remove('hidden');fillBars($('#modal'));
}
function closeModal(){openId=null;$('#modal').classList.add('hidden')}
$('#modal').onclick=e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal();else act(e)};
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

$('#view').onclick=e=>{
 const f=e.target.closest('[data-cat]');
 if(f){cat=f.dataset.cat;show('courses');return}
 const o=e.target.closest('[data-open]');
 if(o){openModal(o.dataset.open);return}
};
function act(e){
 const u=db.cur(),b=e.target.closest('button');if(!u||!b)return;
 if(b.dataset.enroll){u.progress[b.dataset.enroll]=0;db.save(u);notify(u);show(panel);openModal(b.dataset.enroll)}
 if(b.dataset.lesson){
  const c=COURSES.find(x=>x.id===b.dataset.lesson);
  u.progress[c.id]++;db.save(u);
  if(done(u,c))confetti();
  notify(u);show(panel);openModal(c.id);
 }
}
function notify(u){
 const f=ACH.find(a=>a.ok(u)&&!u.seen.includes(a.id));
 if(f){u.seen.push(f.id);db.save(u);toast(`${f.ic} Yeni nailiyyət: ${f.t}`);confetti()}
}
let tt;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');el.style.animation='none';void el.offsetWidth;el.style.animation='';clearTimeout(tt);tt=setTimeout(()=>el.classList.add('hidden'),3200)}

if(db.cur())enter(false);else setMode('reg');
</script>
